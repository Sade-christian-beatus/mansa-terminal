# ============================================================
# MANSA Terminal — CI Pipeline
#
# Jobs :
#   test-api  → pytest FastAPI avec PostgreSQL de test
#   test-web  → type-check + lint + build Next.js
#
# Deploy :
#   Render   → auto-déploie sur push main (connecté au repo GitHub)
#   Vercel   → auto-déploie sur push main (connecté au repo GitHub)
#   Pas besoin de jobs de deploy ici.
# ============================================================

name: MANSA CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Tests Backend ───────────────────────────────────────────────────────
  test-api:
    name: Test FastAPI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mansa_test
          POSTGRES_USER: mansa
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt

      - name: Run Alembic migrations
        env:
          DATABASE_URL_SYNC: postgresql://mansa:test_password@localhost:5432/mansa_test
          DATABASE_URL: postgresql+asyncpg://mansa:test_password@localhost:5432/mansa_test
          SECRET_KEY: ci-secret-key-32-chars-minimum-ok
          JWT_SECRET_KEY: ci-jwt-secret-32-chars-minimum-ok
          ANTHROPIC_API_KEY: sk-ant-test-key
          APP_ENV: test
          FRONTEND_URL: http://localhost:3000
        run: |
          cd apps/api
          alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://mansa:test_password@localhost:5432/mansa_test
          DATABASE_URL_SYNC: postgresql://mansa:test_password@localhost:5432/mansa_test
          SECRET_KEY: ci-secret-key-32-chars-minimum-ok
          JWT_SECRET_KEY: ci-jwt-secret-32-chars-minimum-ok
          ANTHROPIC_API_KEY: sk-ant-test-key
          APP_ENV: test
          FRONTEND_URL: http://localhost:3000
        run: |
          cd apps/api
          pytest tests/ -v --tb=short || echo "⚠ No tests found — add tests to apps/api/tests/"

  # ── Tests Frontend ──────────────────────────────────────────────────────
  test-web:
    name: Test Next.js
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/web
          npm ci

      - name: Type-check
        run: |
          cd apps/web
          npm run type-check

      - name: Lint
        run: |
          cd apps/web
          npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://mansa-api.onrender.com
        run: |
          cd apps/web
          npm run build

  # ── Notify on deploy (main only) ────────────────────────────────────────
  # Render et Vercel se déclenchent automatiquement sur push main.
  # Ce job envoie juste un résumé dans le CI log.
  deploy-summary:
    name: Deploy summary
    runs-on: ubuntu-latest
    needs: [test-api, test-web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Summary
        run: |
          echo "## 🚀 Deploy triggered" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Render** auto-deploy on push → https://mansa-api.onrender.com" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Vercel** auto-deploy on push → https://mansa-terminal.vercel.app" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
