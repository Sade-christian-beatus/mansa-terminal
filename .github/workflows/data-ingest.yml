# ============================================================
# MANSA Terminal — Pipeline d'ingestion des données macro
#
# Schedules :
#   • Lundi 06:00 UTC  → IMF WEO + World Bank WDI + extra (hebdo)
#   • 1er du mois 07:30 UTC → refresh complet, y compris sources annuelles
#     (Comtrade · EIA · NASA VIIRS)
#   • workflow_dispatch → manuel (choix : imf / worldbank / extra / comtrade /
#     eia / nasa / odfa / all)
#
# Secrets :
#   DATABASE_URL_SYNC           : postgresql://...   (requis)
#   COMTRADE_SUBSCRIPTION_KEY   : clé UN Comtrade    (optionnel — sinon ~15 pays)
#   EIA_API_KEY                 : clé EIA            (requis pour la source eia)
#   NASA_EARTHDATA_TOKEN        : token Earthdata    (optionnel — WVS public sinon)
#
# Sources NON câblées ici (impossibles sur runner GitHub) :
#   • emdat : nécessite un fichier Excel téléchargé manuellement depuis emdat.be
#             → lancer en local : DATABASE_URL_SYNC=... \
#               python scripts/ingest_emdat.py --file public_emdat_*.xlsx
#   • odfa  : portail Cloudflare bloque les IP datacenter (403) — voir étape ci-dessous
# ============================================================

name: MANSA Data Ingestion

on:
  schedule:
    - cron: "0 6 * * 1"      # Hebdo — lundi 06:00 UTC
    - cron: "30 7 1 * *"     # Mensuel — 1er du mois 07:30 UTC

  workflow_dispatch:
    inputs:
      source:
        description: "Source à ingérer"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - imf
          - worldbank
          - extra
          - comtrade
          - eia
          - nasa
          - odfa
      dry_run:
        description: "Dry-run (aucune écriture DB)"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: data-ingest
  cancel-in-progress: false

# Force Node.js 24 pour toutes les actions (deadline GitHub : 16 juin 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ingest:
    name: Ingest macro data
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
      COMTRADE_SUBSCRIPTION_KEY: ${{ secrets.COMTRADE_SUBSCRIPTION_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      NASA_EARTHDATA_TOKEN: ${{ secrets.NASA_EARTHDATA_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install script dependencies
        run: pip install -r scripts/requirements.txt

      # ── Seed pays (idempotent) ───────────────────────────────────────────
      - name: Seed countries table
        run: python scripts/seed_countries.py

      - name: Seed AI knowledge base
        run: python scripts/seed_knowledge.py

      # ── Déterminer quelles sources ingérer ──────────────────────────────
      - name: Resolve sources to run
        id: sources
        run: |
          SOURCE="${{ github.event.inputs.source || 'all' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          SCHEDULE="${{ github.event.schedule }}"
          EVENT="${{ github.event_name }}"
          RUN_IMF="false"; RUN_WB="false"; RUN_EXTRA="false"; RUN_ODFA="false"
          RUN_COMTRADE="false"; RUN_EIA="false"; RUN_NASA="false"
          if [[ "$SOURCE" == "all" || "$SOURCE" == "imf" ]];       then RUN_IMF="true";   fi
          if [[ "$SOURCE" == "all" || "$SOURCE" == "worldbank" ]];  then RUN_WB="true";    fi
          if [[ "$SOURCE" == "all" || "$SOURCE" == "extra" ]];      then RUN_EXTRA="true"; fi
          # Sources annuelles (Comtrade · EIA · NASA) : sélection explicite, OU
          # 'all' en déclenchement MANUEL, OU le refresh mensuel (1er du mois).
          # Volontairement exclues de l'hebdo 'all' (lourdes + données annuelles).
          if [[ "$SOURCE" == "comtrade" ]]; then RUN_COMTRADE="true"; fi
          if [[ "$SOURCE" == "eia" ]];      then RUN_EIA="true";      fi
          if [[ "$SOURCE" == "nasa" ]];     then RUN_NASA="true";     fi
          if [[ "$SOURCE" == "all" && "$EVENT" == "workflow_dispatch" ]] || [[ "$SCHEDULE" == "30 7 1 * *" ]]; then
            RUN_COMTRADE="true"; RUN_EIA="true"; RUN_NASA="true"
          fi
          # ODFA seulement sur demande explicite : le portail Cloudflare bloque les
          # IP datacenter des runners GitHub (403) → à lancer depuis une IP autorisée.
          if [[ "$SOURCE" == "odfa" ]];                             then RUN_ODFA="true";  fi
          echo "run_imf=$RUN_IMF"           >> "$GITHUB_OUTPUT"
          echo "run_wb=$RUN_WB"             >> "$GITHUB_OUTPUT"
          echo "run_extra=$RUN_EXTRA"       >> "$GITHUB_OUTPUT"
          echo "run_comtrade=$RUN_COMTRADE" >> "$GITHUB_OUTPUT"
          echo "run_eia=$RUN_EIA"           >> "$GITHUB_OUTPUT"
          echo "run_nasa=$RUN_NASA"         >> "$GITHUB_OUTPUT"
          echo "run_odfa=$RUN_ODFA"         >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN"           >> "$GITHUB_OUTPUT"
          echo "Source: $SOURCE | dry-run: $DRY_RUN | IMF: $RUN_IMF | WB: $RUN_WB | Extra: $RUN_EXTRA | Comtrade: $RUN_COMTRADE | EIA: $RUN_EIA | NASA: $RUN_NASA | ODFA: $RUN_ODFA"

      # ── IMF WEO ──────────────────────────────────────────────────────────
      - name: Ingest IMF WEO
        if: steps.sources.outputs.run_imf == 'true'
        run: |
          ARGS="${{ steps.sources.outputs.dry_run == 'true' && '--dry-run' || '' }}"
          python scripts/ingest_imf.py $ARGS

      # ── World Bank WDI ───────────────────────────────────────────────────
      - name: Ingest World Bank WDI
        if: steps.sources.outputs.run_wb == 'true'
        run: |
          ARGS="${{ steps.sources.outputs.dry_run == 'true' && '--dry-run' || '' }}"
          python scripts/ingest_wb.py $ARGS

      # ── Sources supplémentaires (ILO · FAO · Climate Watch) ─────────────
      - name: Ingest extra sources (ILO · FAO · Climate Watch)
        if: steps.sources.outputs.run_extra == 'true'
        run: |
          ARGS="${{ steps.sources.outputs.dry_run == 'true' && '--dry-run' || '' }}"
          python scripts/ingest_extra.py $ARGS

      # ── UN Comtrade — flux commerciaux bilatéraux (annuel) ───────────────
      # Sans COMTRADE_SUBSCRIPTION_KEY : limité aux ~15 plus grandes économies.
      # Non bloquant : l'API publique peut throttler.
      - name: Ingest UN Comtrade
        if: steps.sources.outputs.run_comtrade == 'true'
        continue-on-error: true
        run: |
          ARGS="${{ steps.sources.outputs.dry_run == 'true' && '--dry-run' || '' }}"
          python scripts/ingest_comtrade.py $ARGS

      # ── EIA International Energy (annuel) ─────────────────────────────────
      # Nécessite EIA_API_KEY (sinon le script sort en erreur) → on saute si absent.
      - name: Ingest EIA energy data
        if: steps.sources.outputs.run_eia == 'true' && env.EIA_API_KEY != ''
        continue-on-error: true
        run: |
          ARGS="${{ steps.sources.outputs.dry_run == 'true' && '--dry-run' || '' }}"
          python scripts/ingest_eia.py $ARGS

      # ── NASA VIIRS Nightlights — proxy d'activité économique (annuel) ─────
      # Aucune clé requise (WVS public). Non bloquant : fetch d'images, peut être lent.
      - name: Ingest NASA VIIRS nightlights
        if: steps.sources.outputs.run_nasa == 'true'
        continue-on-error: true
        run: |
          ARGS="${{ steps.sources.outputs.dry_run == 'true' && '--dry-run' || '' }}"
          python scripts/ingest_nasa_viirs.py $ARGS

      # ── Sources nationales ODFA / Knoema (INSD Burkina Faso, pilote) ─────
      # NB : le portail (Cloudflare) bloque les IP datacenter des runners GitHub
      # (HTTP 403). À lancer plutôt depuis une IP résidentielle/autorisée :
      #   DATABASE_URL_SYNC=... python scripts/ingest_odfa.py --country BFA --limit 40
      # L'étape est non bloquante pour ne pas faire échouer le pipeline.
      - name: Ingest ODFA national sources (INSD)
        if: steps.sources.outputs.run_odfa == 'true'
        continue-on-error: true
        run: |
          ARGS="${{ steps.sources.outputs.dry_run == 'true' && '--dry-run' || '' }}"
          python scripts/ingest_odfa.py --country BFA --limit 40 $ARGS

      # ── Keepalive backend ────────────────────────────────────────────────
      - name: Ping Render API (keepalive)
        if: always()
        run: |
          API_URL="${{ vars.RENDER_API_URL || 'https://mansa-terminal.onrender.com' }}"
          curl --silent --max-time 10 --retry 2 \
            -o /dev/null -w "HTTP %{http_code}\n" \
            "$API_URL/health" || echo "Ping failed (non-fatal)"

      # ── Résumé ───────────────────────────────────────────────────────────
      - name: Ingestion summary
        if: always()
        run: |
          echo "## MANSA Ingestion Report" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Date**: $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Source**: ${{ github.event.inputs.source || 'all (scheduled)' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dry-run**: ${{ steps.sources.outputs.dry_run }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger**: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"

  # ── Keepalive quotidien (indépendant de l'ingestion) ─────────────────────
  keepalive:
    name: Render keepalive ping
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Ping health endpoint
        run: |
          API_URL="${{ vars.RENDER_API_URL || 'https://mansa-terminal.onrender.com' }}"
          curl --silent --max-time 15 --retry 3 --retry-delay 5 \
            -o /dev/null -w "HTTP %{http_code} — ${API_URL}/health\n" \
            "$API_URL/health"
