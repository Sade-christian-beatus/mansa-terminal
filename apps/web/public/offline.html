<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MANSA Terminal — Hors ligne</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #000; color: #e5e7eb; text-align: center; padding: 24px;
    }
    .card { max-width: 360px; }
    .dot { width: 64px; height: 64px; border-radius: 9999px; margin: 0 auto 20px;
      background: #0ea5a0; opacity: .9; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { color: #9ca3af; line-height: 1.5; margin: 0 0 20px; }
    button { background: #0ea5a0; color: #00110f; border: 0; border-radius: 10px;
      padding: 10px 18px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>Vous êtes hors ligne</h1>
    <p>MANSA Terminal nécessite une connexion pour charger les données macro en
       temps réel. Vérifiez votre réseau, puis réessayez.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
