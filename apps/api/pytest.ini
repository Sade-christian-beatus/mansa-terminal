[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    integration: tests d'intégration
    unit: tests unitaires
    security: tests de sécurité (injection, accès, quotas)
