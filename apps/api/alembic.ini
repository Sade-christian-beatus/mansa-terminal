[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Cette URL est remplacée au runtime par env.py (settings.database_url_sync_value).
# Elle ne doit pas être utilisée directement — valeur placeholder uniquement.
sqlalchemy.url = postgresql://mansa:mansa_dev_password@localhost:5432/mansa_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
